name: PMCP pre-B0 cancellation fallback
'on':
  pull_request:
    branches:
    - test/pmcp-ci-20261020-preb0-fallback-base
permissions:
  contents: read
jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Bounded synthetic cancellation window
      run: 'echo "Synthetic check semantics only; no PMCP suite claim"

        sleep 180

        '
  ci-scope:
    needs:
    - hold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      proof_valid: ${{ steps.scope.outputs.proof_valid }}
    steps:
    - id: scope
      run: 'echo "mode=FULL" >> "$GITHUB_OUTPUT"

        echo "proof_valid=false" >> "$GITHUB_OUTPUT"

