name: "Dagger CI offload"
description: >-
  Offload a heavy, containerised gate command to a Tailscale-reachable
  Docker host (e.g. a fleet member's rootless engine) instead of running it
  on the GitHub-hosted runner. Extracted from Consiliency/governed-pipeline
  PR #68 (the CI-offload pilot), proven live/E2E on that repo. Fail-closed
  by construction: if the remote host is unreachable, this action fails —
  it never falls back to a silent local run.

inputs:
  command:
    description: >-
      The gate command to run once the offload environment is set up (e.g.
      "npm run agent:gate"). Must be a command whose containerised path
      reads AGENT_DAGGER / AGENT_REMOTE_HOST (or DOCKER_HOST directly) to
      route its `dagger` calls at the remote engine — see the README.
    required: true
  eligible:
    description: >-
      String "true"/"false" computed by the CALLER workflow (trust gate +
      secret presence). This action performs the offload when "true" and
      no-ops (every step skipped) when anything else. Keeping this
      computation in the caller, not here, keeps the trust decision
      auditable per-repo instead of buried in a shared action.
    required: true
  remote-host:
    description: Tailnet hostname of the Docker engine to offload to.
    required: false
    default: "ai"
  dagger-version:
    description: >-
      Dagger CLI version to install on the runner. The CLI must match the
      engine running on the remote host, so the default "auto" derives it
      from that host: the version of the `dagger-engine-v<X>` container
      currently running there. An operator upgrading the remote engine then
      flips the CLI on the next run with no change here. When no engine
      container is running on the host, "auto" installs the latest release
      and the CLI provisions that engine on first use. An explicit version
      (e.g. "0.21.7") disables the derivation, but is refused when an engine
      of a different version is running on the host — installing it would
      evict that engine.
    required: false
    default: "auto"
  ci-tag:
    description: Tailscale ACL tag applied to this ephemeral CI node.
    required: false
    default: "tag:ci-gp"
  ssh-user:
    description: Docker-scoped OS user on the remote host (never the default login).
    required: false
    default: "ci-docker"
  ts-oauth-client-id:
    description: >-
      Tailscale OAuth client ID (pass `secrets.TS_OAUTH_CLIENT_ID`). Preferred
      over `ts-authkey`: the client has scope `auth_keys` and the `ci-tag` tag,
      never expires, and tailscale/github-action mints a fresh ephemeral,
      pre-approved key from it on every run. Give both OAuth inputs, or
      `ts-authkey`.
    required: false
    default: ""
  ts-oauth-secret:
    description: Tailscale OAuth client secret (pass `secrets.TS_OAUTH_SECRET`).
    required: false
    default: ""
  ts-authkey:
    description: >-
      Legacy: a Tailscale auth key (pass `secrets.TS_AUTHKEY` — never
      hardcode), ephemeral + reusable + scoped to `ci-tag`. Auth keys expire
      after at most 90 days, which silently breaks every offloaded run; use
      the OAuth inputs instead. Ignored when the OAuth inputs are given.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Trusted event + tailnet credential present (decided by the caller and passed
    # in as `eligible`): join the tailnet as a tagged node so this runner
    # can reach the remote host, and only it — see the Tailscale ACL grant
    # in the adopter README. With an OAuth client, tailscale/github-action
    # mints an ephemeral, pre-approved key for `ci-tag` on every run (the
    # client's tags must include `ci-tag`). With a legacy auth key,
    # "ephemeral" is a property of the key itself. Either way the
    # coordination server removes the node when the job ends.
    # Exactly one credential path: both OAuth inputs, or the legacy auth key.
    # A half-configured OAuth pair is a hard failure, never a silent fallback.
    - name: Check tailnet credentials
      if: inputs.eligible == 'true'
      shell: bash
      env:
        HAS_ID: ${{ inputs.ts-oauth-client-id != '' }}
        HAS_SECRET: ${{ inputs.ts-oauth-secret != '' }}
        HAS_KEY: ${{ inputs.ts-authkey != '' }}
      run: |
        set -euo pipefail
        if [ "$HAS_ID" != "$HAS_SECRET" ]; then
          echo "::error::dagger-offload: give both ts-oauth-client-id and ts-oauth-secret, or neither"; exit 1
        fi
        if [ "$HAS_ID" = false ] && [ "$HAS_KEY" = false ]; then
          echo "::error::dagger-offload: no tailnet credential (ts-oauth-client-id/ts-oauth-secret or ts-authkey)"; exit 1
        fi
        [ "$HAS_ID" = true ] && echo "tailnet credential: OAuth client" || echo "tailnet credential: legacy auth key"

    - name: Connect to tailnet
      if: inputs.eligible == 'true'
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        authkey: ${{ inputs.ts-oauth-secret == '' && inputs.ts-authkey || '' }}
        tags: ${{ inputs.ci-tag }}

    # SSH to the remote host as the docker-scoped user (never the default
    # login mapping) with non-interactive host-key acceptance — a fresh
    # runner has an empty known_hosts, and BatchMode makes any prompt (host
    # key, password) a hard failure instead of a hang.
    - name: Configure SSH for remote host
      if: inputs.eligible == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        {
          echo "Host ${{ inputs.remote-host }}"
          echo "  User ${{ inputs.ssh-user }}"
          echo "  StrictHostKeyChecking accept-new"
          echo "  BatchMode yes"
          echo "  ConnectTimeout 10"
        } >> ~/.ssh/config
        chmod 600 ~/.ssh/config

    # Resolve the dagger CLI version to the engine already running on the
    # remote host. The dagger CLI's docker provisioner starts an engine
    # container named for ITS OWN version and removes every other
    # `dagger-engine-*` container it finds, so a CLI that does not match the
    # running engine does not merely skew coverage (the risk the
    # compute-offload design flagged): it kills the running engine — and
    # any gate mid-flight on it — and provisions its own. Deriving the
    # version from the host makes the CLI a pure function of the engine
    # state, so an engine upgrade never breaks this action and this action
    # never downgrades the engine.
    #
    # Reachability failures here are hard failures (set -e on the docker
    # call), before the gate step — the same fail-closed posture as the
    # preflight below.
    - name: Resolve dagger CLI version
      id: dagger-version
      if: inputs.eligible == 'true'
      shell: bash
      env:
        REQUESTED: ${{ inputs.dagger-version }}
        DOCKER_HOST: ssh://${{ inputs.remote-host }}
      run: |
        set -euo pipefail
        # One name per line; only names of the engine's own shape survive the
        # sed, so nothing from the host can reach the installer or the step
        # output except a version string.
        running="$(docker -H "$DOCKER_HOST" ps --filter status=running --format '{{.Names}}' \
          | sed -n 's/^dagger-engine-v\([0-9][0-9A-Za-z.+-]*\)$/\1/p')"
        count=0
        if [ -n "$running" ]; then count="$(printf '%s\n' "$running" | wc -l)"; fi
        if [ "$count" -gt 1 ]; then
          # Whichever CLI we install evicts the engines it does not match, and
          # every one of these may have a gate on it. Ambiguous: refuse.
          echo "more than one dagger engine is running on $DOCKER_HOST; refusing to pick one (the CLI would evict the others):" >&2
          printf '  dagger-engine-v%s\n' $running >&2
          exit 1
        fi
        if [ "$REQUESTED" != "auto" ]; then
          if [ -n "$running" ] && [ "$running" != "$REQUESTED" ]; then
            echo "dagger CLI version pinned to $REQUESTED but the engine running on $DOCKER_HOST is $running; refusing (installing $REQUESTED would evict that engine)" >&2
            exit 1
          fi
          echo "dagger CLI version pinned explicitly: $REQUESTED"
          echo "version=$REQUESTED" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "$running" ]; then
          echo "dagger CLI version derived from the engine running on $DOCKER_HOST: $running"
        else
          echo "no dagger-engine-v* container is running on $DOCKER_HOST; installing the latest release (it will provision that engine on first use)"
        fi
        echo "version=$running" >> "$GITHUB_OUTPUT"

    # DAGGER_VERSION empty means "latest" to the installer (the no-engine
    # fallback above); anything else is installed exactly.
    - name: Install dagger CLI
      if: inputs.eligible == 'true'
      shell: bash
      env:
        BIN_DIR: /home/runner/.dagger-bin
        DAGGER_VERSION: ${{ steps.dagger-version.outputs.version }}
      run: |
        set -euo pipefail
        if [ -z "$DAGGER_VERSION" ]; then unset DAGGER_VERSION; fi
        curl -fsSL https://dl.dagger.io/dagger/install.sh | sh
        echo "$BIN_DIR" >> "$GITHUB_PATH"

    # FAIL-CLOSED AVAILABILITY: this must be a hard failure, never a skip.
    # If the remote host/tailnet is unreachable or misconfigured, this step
    # fails — before the gate step — and the offloaded gate step below
    # never runs (a failed composite `run` step stops the action, which
    # fails the calling job's step). There is no code path that turns an
    # unreachable remote host into a green result. Re-verified empirically
    # under composite execution — see the adopter README.
    - name: Preflight — verify remote Docker engine is reachable
      if: inputs.eligible == 'true'
      shell: bash
      env:
        DOCKER_HOST: ssh://${{ inputs.remote-host }}
      run: |
        set -euo pipefail
        echo "Probing $DOCKER_HOST ..."
        docker -H "$DOCKER_HOST" version
        dagger version

    # Offloaded: AGENT_DAGGER=1 + a present dagger CLI routes a
    # dagger-aware gate command through `dagger call ...`;
    # AGENT_REMOTE_HOST points that dagger subprocess at the remote engine
    # (DOCKER_HOST=ssh://<remote-host>, resolved via the SSH config step
    # above). This runs the containerised gate, not any local fallback gate
    # — see the README's coverage-parity note.
    #
    # `command -v dagger` is a belt-and-suspenders assertion: gate scripts
    # that implement the AGENT_REMOTE_HOST convention (see
    # governed-pipeline's daggerRemoteEnv()) typically degrade silently to
    # a local run if the CLI is missing, by design, for the opt-in local
    # case. On THIS path that silent degrade would mean "no offload
    # happened" reads as a green, unremarked local run instead of a
    # failure. Refuse to let that happen.
    - name: Run offloaded command
      if: inputs.eligible == 'true'
      shell: bash
      env:
        AGENT_DAGGER: "1"
        AGENT_REMOTE_HOST: ${{ inputs.remote-host }}
      run: |
        set -euo pipefail
        command -v dagger >/dev/null || {
          echo "dagger CLI missing on the eligible/offload path — refusing to silently fall back to a local run" >&2
          exit 1
        }
        ${{ inputs.command }}
